services:
  - type: web
    name: riviggy-backend
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: CLIENT_URL
        value: https://raman298.github.io
      - key: ENABLE_IN_MEMORY_DB
        value: "false"
      - key: JWT_SECRET
        sync: false
      - key: MONGODB_URI
        sync: false